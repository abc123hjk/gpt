<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>小橘 · 动作预览</title><style>body{background:#f8f6f0;color:#535e48;font-family:system-ui;margin:32px}h1{font-weight:500}p{color:#959d86}main{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}article{background:#f1e8d6;border-radius:15px;text-align:center;padding:10px}canvas{width:155px;height:155px;image-rendering:pixelated}small{display:block;padding-bottom:10px}</style></head><body><h1>小橘的日常</h1><p>TANGERINE · 原创像素动画 · 11 种状态</p><main></main><script src="../src/cat-art.js"></script><script>
const names={idle:'待机 · 眨眼甩尾',walk:'走路 · 桌面溜达',sleep:'睡觉 · 小小的 Zzz',pet:'摸头 · 爱心呼噜',eat:'吃鱼 · 咔嚓咔嚓',happy:'开心 · 跳起来',focus:'专注 · 敲小键盘',drag:'拎起 · 四爪悬空',lick:'舔爪 · 爱干净',stretch:'伸懒腰 · 舒展一下',chase:'追尾巴 · 自己玩耍'};
const list=[];for(const [state,name] of Object.entries(names)){const el=document.createElement('article');const c=document.createElement('canvas');c.width=c.height=256;el.append(c);const s=document.createElement('small');s.textContent=name;el.append(s);document.querySelector('main').append(el);list.push([c.getContext('2d'),state]);}function frame(t){for(const [ctx,state]of list)CatArt.draw(ctx,state,t/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
